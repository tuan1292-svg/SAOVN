<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAOVN - Ultra Smooth Input</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; background-color: #0d1117; color: #c9d1d9; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .glass-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; backdrop-filter: blur(12px); box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .cyber-input { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; padding: 8px 12px; border-radius: 8px; outline: none; transition: 0.3s; font-family: monospace; text-align: center; }
        .cyber-input:focus { border-color: #3b82f6; box-shadow: 0 0 8px rgba(59, 130, 246, 0.4); }
        
        .money-input { background: transparent; border: none; border-bottom: 1px dashed rgba(255,255,255,0.3); outline: none; text-align: right; font-family: monospace; font-weight: bold; width: 110px; transition: 0.3s; padding: 4px 0; }
        .money-input:focus { border-bottom: 1px solid currentColor; box-shadow: 0 4px 6px -6px currentColor; }

        .btn-outline { border: 1px solid rgba(255,255,255,0.2); color: #c9d1d9; font-weight: bold; border-radius: 8px; padding: 8px 16px; transition: 0.3s; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;}
        .btn-outline:active { background: rgba(255, 255, 255, 0.1); transform: scale(0.98); }
        .label-tech { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: #8b949e; }
        
        ::-webkit-scrollbar { width: 2px; height: 2px; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }

        #toast {
            visibility: hidden; min-width: 250px; background-color: #ef4444; color: #fff; text-align: center; border-radius: 12px; padding: 12px 20px;
            position: fixed; z-index: 100; left: 50%; transform: translateX(-50%); bottom: -50px; font-size: 12px; font-weight: bold;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); opacity: 0; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        #toast.show { visibility: visible; opacity: 1; bottom: 30px; }
    </style>
</head>
<body class="pb-20">

    <div id="toast"><i class="fa-solid fa-triangle-exclamation mr-2"></i><span id="toast-msg">Lỗi!</span></div>

    <header class="sticky top-0 z-50 bg-[#0d1117]/80 backdrop-blur-xl pt-4 pb-4 px-4 md:px-8 border-b border-white/5 mb-6 shadow-lg">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div>
                <div class="label-tech hidden md:block">Personal Finance</div>
                <h1 class="text-xl md:text-3xl font-bold tracking-tighter text-white">SAOVN</h1>
            </div>
            <div class="text-right">
                <div class="label-tech mb-1">Dòng tiền khả dụng</div>
                <div id="display-net-surplus" class="text-2xl md:text-4xl font-bold text-blue-400 drop-shadow-[0_0_8px_rgba(59,130,246,0.5)]">0đ</div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 md:px-8 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="space-y-4">
            <div class="glass-card p-5 border-t-2 border-t-green-500/50">
                <div class="flex justify-between items-center mb-4 border-b border-white/10 pb-3">
                    <h2 class="text-sm font-bold uppercase tracking-widest text-green-400"><i class="fa-solid fa-arrow-turn-down mr-2"></i>Nguồn Thu</h2>
                    <button onclick="addItem('income')" class="btn-outline hover:border-green-400 hover:text-green-400"><i class="fa-solid fa-plus"></i></button>
                </div>
                <div id="list-income" class="space-y-4 mb-4 min-h-[20px]"></div>
                <div class="border-t border-white/10 pt-3 flex justify-between items-center bg-green-900/10 p-2 rounded-lg">
                    <span class="label-tech text-green-200/50">Tổng thu</span>
                    <span id="total-income" class="font-mono text-green-400 font-bold">0đ</span>
                </div>
            </div>

            <div class="glass-card p-5 border-t-2 border-t-red-500/50">
                <div class="flex justify-between items-center mb-4 border-b border-white/10 pb-3">
                    <h2 class="text-sm font-bold uppercase tracking-widest text-red-400"><i class="fa-solid fa-arrow-turn-up mr-2"></i>Chi Cố Định</h2>
                    <button onclick="addItem('expense')" class="btn-outline hover:border-red-400 hover:text-red-400"><i class="fa-solid fa-plus"></i></button>
                </div>
                <div id="list-expense" class="space-y-4 mb-4 min-h-[20px]"></div>
                <div class="border-t border-white/10 pt-3 flex justify-between items-center bg-red-900/10 p-2 rounded-lg">
                    <span class="label-tech text-red-200/50">Tổng chi</span>
                    <span id="total-expense" class="font-mono text-red-400 font-bold">0đ</span>
                </div>
            </div>
        </div>

        <div class="lg:col-span-2 space-y-6">
            
            <div class="glass-card p-5 flex flex-col justify-center items-center">
                <div class="label-tech mb-2">Biểu Đồ Phân Bổ</div>
                <div class="w-full h-56 md:h-64 relative">
                    <canvas id="jarsChart"></canvas>
                </div>
            </div>

            <div class="glass-card p-5 border-t-2 border-t-blue-500/50">
                <div class="flex justify-between items-start mb-6 border-b border-white/10 pb-4">
                    <div class="w-full">
                        <div class="flex justify-between items-center mb-2">
                            <h2 class="text-sm font-bold uppercase tracking-widest text-blue-400"><i class="fa-solid fa-layer-group mr-2"></i>Hũ Chi Tiêu</h2>
                            <button onclick="addJar()" class="btn-outline hover:border-blue-400 hover:text-blue-400 py-1"><i class="fa-solid fa-plus"></i> Hũ mới</button>
                        </div>
                        
                        <div class="flex justify-between bg-black/30 p-2 rounded-lg border border-white/5 mt-3">
                            <div class="text-[11px] text-gray-400">
                                Đã chia: <span id="total-perc-allocated" class="font-bold text-white text-sm ml-1">0%</span>
                            </div>
                            <div class="text-[11px] text-gray-400 text-right">
                                Chưa phân bổ: <span id="unallocated-amt" class="font-bold text-green-400 text-sm ml-1">0đ</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div id="list-jars" class="space-y-4">
                    </div>
            </div>
        </div>
    </main>

    <script>
        let db = JSON.parse(localStorage.getItem('saovn_finance_v7')) || {
            income: [{id: 1, name: 'Lương tháng', amount: 20000000}],
            expense: [{id: 2, name: 'Tiền thuê nhà', amount: 4000000}],
            jars: [
                {id: 1, name: 'Điện Nước (UTIL)', percent: 30},
                {id: 2, name: 'Ăn Uống (FOOD)', percent: 20},
                {id: 3, name: 'Hiếu Hỷ (GIFT)', percent: 15},
                {id: 4, name: 'Tiết Kiệm (SAVE)', percent: 20},
                {id: 5, name: 'Đầu Tư (INV)', percent: 15}
            ]
        };

        let chart = null;
        let toastTimeout = null;
        const jarColors = ['#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899', '#06b6d4', '#f43f5e'];

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.add('show');
            if(toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        function getSurplus() {
            const inc = db.income.reduce((sum, i) => sum + i.amount, 0);
            const exp = db.expense.reduce((sum, e) => sum + e.amount, 0);
            return Math.max(0, inc - exp);
        }

        function initChart() {
            const ctx = document.getElementById('jarsChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: [],
                    datasets: [{
                        data: [],
                        backgroundColor: jarColors,
                        borderWidth: 2,
                        borderColor: '#0d1117',
                        hoverOffset: 8
                    }]
                },
                options: {
                    cutout: '70%',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { position: 'bottom', labels: { color: '#c9d1d9', font: { family: 'Space Grotesk', size: 11 }, padding: 15, usePointStyle: true } } 
                    }
                }
            });
        }

        function addItem(type) {
            const name = prompt("Nhập tên khoản:");
            const amountStr = prompt("Số tiền (VNĐ):", "0");
            const amount = parseFloat(amountStr?.replace(/,/g, ''));
            if (name && !isNaN(amount)) {
                db[type].push({ id: Date.now(), name, amount });
                render();
            }
        }

        function deleteItem(type, id) {
            db[type] = db[type].filter(i => i.id !== id);
            render();
        }

        function addJar() {
            const name = prompt("Nhập tên hũ chi tiêu mới:");
            if (name) {
                db.jars.push({ id: Date.now(), name, percent: 0 });
                render();
            }
        }

        function editJarName(id) {
            const jar = db.jars.find(j => j.id === id);
            if(jar) {
                const newName = prompt("Sửa tên hũ:", jar.name);
                if(newName) { jar.name = newName; render(); }
            }
        }

        function deleteJar(id) {
            if(confirm("Bạn có chắc muốn xóa hũ này?")) {
                db.jars = db.jars.filter(j => j.id !== id);
                render();
            }
        }

        function updateJarPerc(id, newVal) {
            const surplus = getSurplus();
            const jar = db.jars.find(j => j.id === id);
            if(jar) {
                let parsedVal = parseFloat(newVal) || 0;
                let otherTotalPerc = db.jars.reduce((sum, j) => j.id !== id ? sum + j.percent : sum, 0);

                if (otherTotalPerc + parsedVal > 100) {
                    parsedVal = 100 - otherTotalPerc;
                    showToast("Đã hết Dòng tiền! Tự động điều chỉnh tỷ lệ.");
                }

                jar.percent = parsedVal; // Giữ nguyên số thập phân để không mất tiền
                render();
            }
        }

        function updateJarAmount(id, newAmountStr) {
            const surplus = getSurplus();
            if (surplus <= 0) {
                showToast("Dòng tiền khả dụng đang bằng 0!");
                render();
                return;
            }

            const jar = db.jars.find(j => j.id === id);
            if(jar) {
                let amount = parseFloat(newAmountStr.replace(/,/g, '')) || 0;
                let otherTotalPerc = db.jars.reduce((sum, j) => j.id !== id ? sum + j.percent : sum, 0);
                let otherTotalAmt = (surplus * otherTotalPerc) / 100;
                let maxAllowedAmt = surplus - otherTotalAmt;

                // Cộng thêm 1đ để tránh lỗi sai số thập phân ẩn của Javascript
                if (amount > maxAllowedAmt + 1) {
                    amount = maxAllowedAmt;
                    showToast("Số tiền vượt quá khoản phân bổ còn lại!");
                }

                // Không dùng Math.round nữa để giữ tính chính xác tuyệt đối
                const newPerc = (amount / surplus) * 100;
                jar.percent = newPerc;
                render();
            }
        }

        function render() {
            let totalInc = 0; let totalExp = 0;
            const listInc = document.getElementById('list-income');
            const listExp = document.getElementById('list-expense');
            listInc.innerHTML = ''; listExp.innerHTML = '';

            db.income.forEach(i => {
                totalInc += i.amount;
                listInc.innerHTML += `
                    <div class="flex justify-between items-center group">
                        <span class="text-sm text-gray-300 font-medium">${i.name}</span>
                        <div class="flex items-center gap-4">
                            <span class="font-mono text-sm text-green-400">${i.amount.toLocaleString()}đ</span>
                            <button onclick="deleteItem('income', ${i.id})" class="text-gray-600 hover:text-red-400 p-1"><i class="fa-solid fa-trash-can text-xs"></i></button>
                        </div>
                    </div>`;
            });

            db.expense.forEach(e => {
                totalExp += e.amount;
                listExp.innerHTML += `
                    <div class="flex justify-between items-center group">
                        <span class="text-sm text-gray-300 font-medium">${e.name}</span>
                        <div class="flex items-center gap-4">
                            <span class="font-mono text-sm text-red-400">${e.amount.toLocaleString()}đ</span>
                            <button onclick="deleteItem('expense', ${e.id})" class="text-gray-600 hover:text-red-400 p-1"><i class="fa-solid fa-trash-can text-xs"></i></button>
                        </div>
                    </div>`;
            });

            document.getElementById('total-income').innerText = totalInc.toLocaleString() + 'đ';
            document.getElementById('total-expense').innerText = totalExp.toLocaleString() + 'đ';

            const surplus = getSurplus();
            document.getElementById('display-net-surplus').innerText = surplus.toLocaleString() + 'đ';

            const listJars = document.getElementById('list-jars');
            listJars.innerHTML = '';
            let totalPerc = 0;
            let chartLabels = [];
            let chartData = [];

            db.jars.forEach((jar, index) => {
                totalPerc += jar.percent;
                // Giữ nguyên số nguyên khi hiển thị tiền để tránh bị lẻ số
                const allocatedAmt = Math.round((surplus * jar.percent) / 100);
                const color = jarColors[index % jarColors.length]; 
                
                chartLabels.push(jar.name);
                chartData.push(allocatedAmt);

                listJars.innerHTML += `
                    <div class="bg-black/20 p-4 rounded-xl border border-white/5 relative overflow-hidden flex flex-col justify-center min-h-[80px]">
                        <div class="absolute bottom-0 left-0 h-1 bg-gradient-to-r from-transparent to-${color} opacity-30" style="width: ${jar.percent}%; background-color: ${color}"></div>
                        
                        <div class="flex justify-between items-center relative z-10 w-full gap-2">
                            <div class="flex flex-col gap-2 w-1/2">
                                <div class="text-sm font-bold uppercase cursor-pointer flex items-center gap-2" style="color: ${color}" onclick="editJarName(${jar.id})">
                                    <span class="w-3 h-3 rounded-full inline-block shadow-sm" style="background-color: ${color}"></span>
                                    <span class="truncate">${jar.name}</span>
                                </div>
                                <div class="flex items-center gap-1">
                                    <input type="number" step="0.1" min="0" max="100" value="${Number(jar.percent.toFixed(1))}" class="cyber-input w-16 !p-1 !text-xs" style="color: ${color}; border-color: ${color}40;" onchange="updateJarPerc(${jar.id}, this.value)">
                                    <span class="text-[10px] font-bold" style="color: ${color}">%</span>
                                </div>
                            </div>
                            
                            <div class="flex flex-col items-end gap-2 w-1/2">
                                <div class="flex items-baseline gap-1" style="color: ${color}">
                                    <input type="text" inputmode="numeric"
                                        value="${allocatedAmt.toLocaleString()}" 
                                        class="money-input text-base md:text-lg"
                                        style="color: ${color}; border-bottom-color: ${color}40;"
                                        onchange="updateJarAmount(${jar.id}, this.value)"
                                        onfocus="this.value = this.value.replace(/,/g, ''); this.select();">
                                    <span class="text-xs font-bold">đ</span>
                                </div>
                                <button onclick="deleteJar(${jar.id})" class="text-gray-600 hover:text-red-400 py-1 px-2" title="Xóa hũ">
                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });

            const percEl = document.getElementById('total-perc-allocated');
            const unallocatedAmtEl = document.getElementById('unallocated-amt');
            
            let displayTotalPerc = Number(totalPerc.toFixed(1));
            percEl.innerText = displayTotalPerc + '%';
            
            let unallocatedPerc = 100 - totalPerc;
            let unallocatedAmt = Math.round((surplus * unallocatedPerc) / 100);
            if(unallocatedAmt < 0 || unallocatedAmt < 5) unallocatedAmt = 0; // Fix sai số siêu nhỏ

            unallocatedAmtEl.innerText = unallocatedAmt.toLocaleString() + 'đ';

            if(displayTotalPerc < 99.9) {
                percEl.classList.remove('text-white', 'text-green-400');
                percEl.classList.add('text-red-400');
                unallocatedAmtEl.classList.remove('text-gray-500');
                unallocatedAmtEl.classList.add('text-green-400'); 
            } else {
                percEl.innerText = '100%';
                percEl.classList.remove('text-red-400');
                percEl.classList.add('text-green-400');
                unallocatedAmtEl.classList.remove('text-green-400');
                unallocatedAmtEl.classList.add('text-gray-500'); 
            }

            chart.data.labels = chartLabels;
            chart.data.datasets[0].data = chartData;
            chart.update();

            localStorage.setItem('saovn_finance_v7', JSON.stringify(db));
        }

        window.onload = () => {
            initChart();
            render();
        };
    </script>
</body>
</html>
