<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Danh Sách Thông Minh</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (xlsx) để đọc file Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Tesseract.js để nhận diện OCR từ hình ảnh -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@v5/dist/tesseract.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
    <div class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8">
        
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-600 mb-2">Tra Cứu Danh Sách Nhanh</h1>
            <p class="text-gray-600">Tải lên file Excel hoặc hình ảnh chứa danh sách để tìm kiếm tên dễ dàng.</p>
        </header>

        <!-- Upload Section -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-6">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Tải lên tệp danh sách (Excel hoặc Ảnh):</label>
            <div class="flex items-center justify-center w-full">
                <label id="drop-zone" class="flex flex-col items-center justify-center w-full h-36 border-2 border-dashed border-gray-300 rounded-xl cursor-pointer bg-gray-50 hover:bg-gray-100 transition-all">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6 px-4 text-center">
                        <svg class="w-8 h-8 mb-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                        </svg>
                        <p class="text-sm text-gray-600"><span class="font-semibold text-blue-600">Nhấn để tải lên</span> hoặc kéo thả file vào đây</p>
                        <p class="text-xs text-gray-400 mt-1">Hỗ trợ .xlsx, .xls, .csv, .png, .jpg, .jpeg</p>
                    </div>
                    <input id="file-input" type="file" class="hidden" accept=".xlsx, .xls, .csv, image/*" />
                </label>
            </div>
            <!-- Trạng thái xử lý -->
            <div id="status-message" class="mt-3 text-sm text-center font-medium text-blue-600 hidden">Đang xử lý dữ liệu, vui lòng chờ...</div>
        </div>

        <!-- Search & Results Section -->
        <div id="app-content" class="hidden space-y-6">
            <!-- Search Bar -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </span>
                    <input type="text" id="search-input" placeholder="Nhập tên cần tìm kiếm trong danh sách..." class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all text-sm">
                </div>
            </div>

            <!-- Results Display -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                    <h2 class="font-semibold text-gray-700">Kết quả tìm kiếm</h2>
                    <span id="result-count" class="text-xs bg-blue-100 text-blue-700 font-semibold px-2.5 py-1 rounded-full">0 kết quả</span>
                </div>
                <div id="results-container" class="divide-y divide-gray-100 max-h-96 overflow-y-auto">
                    <!-- Danh sách kết quả sẽ hiện ở đây -->
                    <div class="p-6 text-center text-gray-400 text-sm">Chưa có từ khóa tìm kiếm hoặc chưa có dữ liệu khớp.</div>
                </div>
            </div>
        </div>

    </div>

    <!-- Script xử lý logic -->
    <script>
        let globalData = []; // Mảng chứa dữ liệu trích xuất được

        const fileInput = document.getElementById('file-input');
        const statusMessage = document.getElementById('status-message');
        const appContent = document.getElementById('app-content');
        const searchInput = document.getElementById('search-input');
        const resultsContainer = document.getElementById('results-container');
        const resultCount = document.getElementById('result-count');

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            statusMessage.classList.remove('hidden');
            statusMessage.textContent = `Đang đọc file ${file.name}...`;

            const fileExtension = file.name.split('.').pop().toLowerCase();

            if (['xlsx', 'xls', 'csv'].includes(fileExtension)) {
                // Xử lý file Excel
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        
                        // Chuyển sheet thành dạng mảng JSON các dòng
                        const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                        
                        // Làm phẳng dữ liệu thành các dòng text có nghĩa để search
                        globalData = [];
                        json.forEach((row, rowIndex) => {
                            const rowString = row.filter(cell => cell !== undefined && cell !== null && cell !== '').join(' - ');
                            if (rowString.trim().length > 0) {
                                globalData.push({
                                    id: rowIndex + 1,
                                    text: rowString,
                                    rawRow: row
                                });
                            }
                        });

                        statusMessage.classList.add('hidden');
                        appContent.classList.remove('hidden');
                        renderResults(globalData);
                    } catch (error) {
                        alert('Lỗi đọc file Excel: ' + error.message);
                        statusMessage.classList.add('hidden');
                    }
                };
                reader.readAsArrayBuffer(file);

            } else if (['png', 'jpg', 'jpeg', 'webp'].includes(fileExtension)) {
                // Xử lý OCR hình ảnh bằng Tesseract.js
                statusMessage.textContent = 'Đang nhận diện chữ từ hình ảnh (OCR)... Quá trình này có thể mất vài giây.';
                try {
                    const { data: { text } } = await Tesseract.recognize(
                        file,
                        'vie+eng', // Hỗ trợ tiếng Việt và tiếng Anh
                        { logger: m => {} }
                    );

                    // Tách dòng văn bản từ kết quả OCR
                    const lines = text.split('\n');
                    globalData = [];
                    lines.forEach((line, index) => {
                        if (line.trim().length > 0) {
                            globalData.push({
                                id: index + 1,
                                text: line.trim()
                            });
                        }
                    });

                    statusMessage.classList.add('hidden');
                    appContent.classList.remove('hidden');
                    renderResults(globalData);
                } catch (error) {
                    alert('Lỗi nhận diện ảnh: ' + error.message);
                    statusMessage.classList.add('hidden');
                }
            } else {
                alert('Định dạng file không được hỗ trợ!');
                statusMessage.classList.add('hidden');
            }
        });

        // Xử lý tìm kiếm thời gian thực
        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase().trim();
            if (!keyword) {
                renderResults(globalData);
                return;
            }

            const filtered = globalData.filter(item => item.text.toLowerCase().includes(keyword));
            renderResults(filtered);
        });

        function renderResults(data) {
            resultCount.textContent = `${data.length} kết quả`;
            if (data.length === 0) {
                resultsContainer.innerHTML = `<div class="p-6 text-center text-gray-400 text-sm">Không tìm thấy kết quả phù hợp.</div>`;
                return;
            }

            let html = '';
            data.forEach(item => {
                html += `<div class="p-4 hover:bg-gray-50 transition-colors flex items-center justify-between">
                    <p class="text-sm text-gray-800 font-medium">${escapeHtml(item.text)}</p>
                    <span class="text-xs text-gray-400 ml-2">Dòng ${item.id}</span>
                </div>`;
            });
            resultsContainer.innerHTML = html;
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
