<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học viện | Chi tiết bài học SAOVN</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="chi-tiet-du-an.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <style>
        /* ĐỒNG BỘ STYLE TỪ DU-AN.HTML VÀ INDEX.HTML */
        body { background-color: #0b0f19; color: #fff; font-family: 'Orbitron', sans-serif;}

        /* --- STYLE CHO AVATAR TRÊN NAV (ĐỒNG BỘ VỚI INDEX/ACADEMY) --- */
        .user-profile-nav {
            display: flex; align-items: center; gap: 12px; padding: 5px 15px;
            background: rgba(255, 255, 255, 0.05); border-radius: 30px;
            border: 1px solid rgba(0, 210, 255, 0.2); transition: 0.3s; margin-left: 15px;
        }
        .user-profile-nav:hover { border-color: #00d2ff; background: rgba(0, 210, 255, 0.05); }
        .nav-avatar-link { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; }
        .nav-avatar {
            width: 35px; height: 35px; border-radius: 50%; background-color: #111;
            background-size: cover; background-position: center; border: 1.5px solid #00d2ff;
            display: flex; align-items: center; justify-content: center; font-size: 12px;
            font-weight: bold; color: #00d2ff; overflow: hidden;
        }
        #display-user-name {
            font-size: 14px; font-weight: 500; max-width: 150px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .btn-logout-mini {
            background: none; border: none; color: #ff4d4d; cursor: pointer;
            font-size: 16px; padding: 5px; transition: 0.2s; display: flex; align-items: center;
        }
        .btn-logout-mini:hover { transform: scale(1.1); }
        .nav-container { display: flex; align-items: center; }

        /* BẢNG ĐIỀU KHIỂN HOÀN THÀNH BÀI HỌC */
        .completion-panel {
            margin-top: 60px;
            padding: 40px 30px;
            background: linear-gradient(180deg, rgba(0, 210, 255, 0.02) 0%, rgba(0, 210, 255, 0.08) 100%);
            border: 1px solid #00d2ff;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 210, 255, 0.1);
        }
        .completion-panel h3 { color: #00d2ff; font-size: 24px; margin-bottom: 15px; letter-spacing: 2px; }
        .completion-panel p { color: #aaa; font-family: sans-serif; margin-bottom: 30px; font-size: 15px; line-height: 1.6;}

        .btn-complete {
            background: rgba(0, 210, 255, 0.1); border: 2px solid #00d2ff; color: #00d2ff;
            padding: 15px 40px; border-radius: 8px; font-family: 'Orbitron'; font-size: 16px;
            font-weight: bold; cursor: pointer; transition: all 0.3s; letter-spacing: 1px;
            text-transform: uppercase; display: inline-flex; align-items: center; gap: 10px;
        }
        .btn-complete:hover { background: #00d2ff; color: #000; box-shadow: 0 0 20px #00d2ff; transform: translateY(-3px); }

        /* Trạng thái Đã hoàn thành */
        .btn-completed-state {
            background: rgba(0, 255, 0, 0.1) !important; border-color: #00ff00 !important; color: #00ff00 !important;
            cursor: default !important; transform: none !important; box-shadow: 0 0 15px rgba(0,255,0,0.2) !important;
        }

        .btn-back-academy {
            background: transparent; border: 1px solid #555; color: #ccc;
            padding: 10px 20px; border-radius: 6px; cursor: pointer; font-family: 'Orbitron'; 
            margin-top: 20px; transition: 0.3s;
        }
        .btn-back-academy:hover { border-color: #fff; color: #fff; }

        /* Căn chỉnh nội dung trình soạn thảo Quill */
        .p-content-card { font-family: sans-serif; }
        .p-content-wrapper img { max-width: 100%; border-radius: 8px; margin: 15px 0; }
        .p-content-wrapper h2, .p-content-wrapper h3 { color: #00d2ff; font-family: 'Orbitron'; margin-top: 30px; }
        
        /* Chỉnh lại padding hero-section để không bị lẹm header */
        .about-hero-pro { padding-top: 140px; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo-wrapper">
            <span class="logo-text">SAOVN</span>
            <span class="logo-slogan">Special Actions Organization for Vietnam</span>
        </a>

        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>

		<nav class="nav-container">
			<a href="index.html" class="nav-link">Trang chủ</a>
			<a href="ve-saovn.html" class="nav-link">Về SAOVN</a>
			<a href="du-an.html" class="nav-link">Dự án</a>
			<a href="quy-tac.html" class="nav-link">Quy tắc</a>
            <a href="quy.html" class="nav-link">Qũy</a>
            <a href="academy.html" class="nav-link active">Học viện</a>
			
			<a href="register.html" class="nav-link" id="nav-register">Đăng ký</a>
			<button class="btn-login" id="nav-login-btn" onclick="window.location.href='login.html'">Đăng nhập</button>
			
			<div id="user-profile-box" class="user-profile-nav" style="display: none;">
                <a href="dashboard.html" class="nav-avatar-link" title="Đi tới bảng điều khiển">
                    <div id="display-avatar" class="nav-avatar">SV</div>
                    <span id="display-user-name">Đang tải...</span>
                </a>
                <button id="auth-logout-btn" class="btn-logout-mini" title="Đăng xuất">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
		</nav>
    </header>

    <main id="main-content">
        <section class="about-hero-pro">
            <div class="container">
                <span class="sub-title" id="p-category-top" data-aos="fade-up" style="color: #00d2ff;">HỌC VIỆN TÀI CHÍNH</span>
                <h1 id="p-title-top" data-aos="fade-up" data-aos-delay="200" style="font-size: 2.5rem; text-shadow: 0 0 15px #00d2ff; font-family: 'Orbitron';">
                    ĐANG TẢI BÀI HỌC...
                </h1>
            </div>
        </section>

        <section class="main-project-container">
            <div class="p-content-card" data-aos="fade-up" style="border-color: rgba(0,210,255,0.2);">

                
                <div id="p-content" class="p-content-wrapper" style="font-size: 1.15rem; line-height: 1.8;">
                    <div style="text-align:center; padding: 50px; color: #00d2ff;">
                        <i class="fas fa-spinner fa-spin fa-2x"></i><br><br>ĐANG GIẢI MÃ DỮ LIỆU...
                    </div>
                </div>

                <div class="completion-panel" id="completion-zone" style="display: none;">
                    <h3><i class="fas fa-graduation-cap"></i> KẾT THÚC BÀI HỌC</h3>
                    <p>Đặc vụ cần xác nhận đã nắm vững kiến thức phần này để hệ thống cấp quyền truy cập bài tiếp theo.</p>
                    
                    <button id="btn-mark-complete" class="btn-complete">
                        <i class="fas fa-check-double"></i> XÁC NHẬN HOÀN THÀNH
                    </button>
                    <br>
                    <button class="btn-back-academy" onclick="window.location.href='academy.html'">
                        <i class="fas fa-arrow-left"></i> TRỞ VỀ HỌC VIỆN
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBa3zOMwQr-KO77c5SsXEar8ycoRkmFbLk",
            authDomain: "saovn-project.firebaseapp.com",
            projectId: "saovn-project",
            storageBucket: "saovn-project.firebasestorage.app",
            messagingSenderId: "194928117396",
            appId: "1:194928117396:web:642612a60105add5639681"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const lessonId = urlParams.get('id');
        let currentUserData = null;

        // XỬ LÝ NAV VÀ AUTH
        const userProfileBox = document.getElementById('user-profile-box');
        const loginBtn = document.getElementById('nav-login-btn');
        const registerLink = document.getElementById('nav-register');
        const displayUserName = document.getElementById('display-user-name');
        const displayAvatar = document.getElementById('display-avatar');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                userProfileBox.style.display = 'flex';
                if(loginBtn) loginBtn.style.display = 'none';
                if(registerLink) registerLink.style.display = 'none';
                
                const uDoc = await getDoc(doc(db, "users", user.uid));
                if (uDoc.exists()) {
                    currentUserData = { uid: user.uid, ...uDoc.data() };
                    
                    // Gắn Tên và Avatar lên Nav giống hệt academy.html
                    const userName = currentUserData.fullName || user.email.split('@')[0];
                    displayUserName.innerText = "Chào, " + userName;

                    if (currentUserData.photoURL) {
                        displayAvatar.innerText = "";
                        displayAvatar.style.backgroundImage = `url('${currentUserData.photoURL}')`;
                    } else {
                        displayAvatar.innerText = userName.charAt(0).toUpperCase();
                        displayAvatar.style.backgroundImage = "none";
                    }
                    
                    // Kiểm tra quyền học viện
                    const isApproved = currentUserData.role === 'admin' || currentUserData.isApproved === true;
                    if(!isApproved) {
                        alert("Cảnh báo: Bạn chưa được cấp quyền truy cập Học viện!");
                        window.location.href = "academy.html";
                        return;
                    }
                }
            } else {
                alert("Hệ thống: Bạn cần đăng nhập để xem dữ liệu này!");
                window.location.href = "login.html";
                return;
            }
            
            loadLessonDetail();
        });

        document.getElementById('auth-logout-btn').onclick = () => {
            signOut(auth).then(() => window.location.href = "index.html");
        };

        // TẢI NỘI DUNG BÀI HỌC
        async function loadLessonDetail() {
            if(!lessonId) return;
            try {
                const snap = await getDoc(doc(db, "projects", lessonId));
                if(snap.exists()) {
                    const d = snap.data();
                    
                    document.getElementById('p-title-top').innerText = d.title.toUpperCase();
                    
                    
                    
                    document.getElementById('p-content').innerHTML = d.content;
                    
                    setupCompletionButton();
                    
                    document.getElementById('completion-zone').style.display = 'block';
                    AOS.init({ duration: 1000, once: true });
                } else {
                    document.getElementById('p-content').innerHTML = "<h3 style='color:#ff4d4d;text-align:center;'>LỖI: BÀI HỌC KHÔNG TỒN TẠI HOẶC ĐÃ BỊ XÓA.</h3>";
                }
            } catch (e) {
                console.error("Lỗi tải bài:", e);
            }
        }

        // LOGIC NÚT ĐÁNH DẤU HOÀN THÀNH
        function setupCompletionButton() {
            const btnComplete = document.getElementById('btn-mark-complete');
            const completedList = currentUserData.completedLessons || [];
            
            if (completedList.includes(lessonId)) {
                btnComplete.classList.add('btn-completed-state');
                btnComplete.innerHTML = '<i class="fas fa-check-circle"></i> BẠN ĐÃ HOÀN THÀNH BÀI NÀY';
                btnComplete.onclick = null;
            } else {
                btnComplete.onclick = async () => {
                    btnComplete.disabled = true;
                    btnComplete.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ĐANG LƯU TIẾN ĐỘ...';
                    
                    try {
                        const userRef = doc(db, "users", currentUserData.uid);
                        await updateDoc(userRef, {
                            completedLessons: arrayUnion(lessonId)
                        });
                        
                        btnComplete.classList.add('btn-completed-state');
                        btnComplete.innerHTML = '<i class="fas fa-check-circle"></i> ĐÃ MỞ KHÓA BÀI TIẾP THEO';
                        
                        setTimeout(() => {
                            window.location.href = "academy.html";
                        }, 1500);
                        
                    } catch (err) {
                        console.error("Lỗi cập nhật tiến độ:", err);
                        alert("Lỗi hệ thống khi lưu tiến độ!");
                        btnComplete.disabled = false;
                        btnComplete.innerHTML = '<i class="fas fa-check-double"></i> XÁC NHẬN HOÀN THÀNH LẠI';
                    }
                };
            }
        }

        // Kích hoạt Mobile Menu của Nav chuẩn
        const menuBtn = document.querySelector('#mobile-menu');
        if(menuBtn) {
            menuBtn.onclick = function() {
                this.classList.toggle('is-active');
                document.querySelector('.nav-container').classList.toggle('active');
            };
        }
    </script>
</body>
</html>
