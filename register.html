<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gia nhập SAOVN | Đăng ký thành viên</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <div class="register-container">
        <div class="register-box">
            <a href="index.html" class="register-logo">SAOVN</a>
            <h2>GIA NHẬP TỔ CHỨC</h2>
            <p>Hoàn thiện hồ sơ để bắt đầu hành động</p>
            
            <form id="registerForm">
                <div class="form-grid">
                    <div class="input-group full-width">
                        <i class="fas fa-user-tag"></i>
                        <input type="text" id="regName" placeholder="Họ và tên" required>
                    </div>
                    <div class="input-group full-width">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="regEmail" placeholder="Email liên lạc" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="regPass" placeholder="Mật khẩu" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-shield-alt"></i>
                        <input type="password" id="regConfirmPass" placeholder="Nhập lại mật khẩu" required>
                    </div>
                </div>
                <button type="submit" class="register-btn" id="btnRegister">BẮT ĐẦU GIA NHẬP</button>
				<div id="verify-note" style="display: none; margin-top: 15px; padding: 10px; background: rgba(255, 193, 7, 0.1); border: 1px solid #ffc107; border-radius: 8px; font-size: 13px; color: #ffc107; line-height: 1.4;">
					<i class="fas fa-exclamation-triangle"></i> <b>Lưu ý quan trọng:</b> <br>
					Hệ thống đã gửi email kích hoạt. Nếu không thấy, bạn hãy kiểm tra mục <b>Thư rác (Spam)</b> hoặc <b>Quảng cáo</b>.
				</div>
            </form>
            
            <div class="register-footer" style="margin-top: 20px; font-size: 14px; color: #666;">
                Đã có tài khoản? <a href="login.html" style="color: var(--accent-color); text-decoration: none;">Đăng nhập tại đây</a>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
        getAuth, 
        createUserWithEmailAndPassword, 
        sendEmailVerification, 
        signOut,
        deleteUser 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { 
        getFirestore, 
        doc, 
        setDoc 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // ĐOẠN NÀY LÀ QUAN TRỌNG NHẤT - KHÔNG ĐƯỢC THIẾU
    const firebaseConfig = {
        apiKey: "AIzaSyBa3zOMwQr-KO77c5SsXEar8ycoRkmFbLk",
        authDomain: "saovn-project.firebaseapp.com",
        projectId: "saovn-project",
        storageBucket: "saovn-project.firebasestorage.app",
        messagingSenderId: "194928117396",
        appId: "1:194928117396:web:642612a60105add5639681",
        measurementId: "G-L7Y106VT85"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Khai báo biến btn ngay lập tức để không bị lỗi "initialization"
        const btn = document.getElementById('btnRegister'); 
        
        const name = document.getElementById('regName').value;
        const email = document.getElementById('regEmail').value;
        const pass = document.getElementById('regPass').value;
        const confirmPass = document.getElementById('regConfirmPass').value;

        if(pass !== confirmPass) return alert("Mật khẩu không khớp!");

        let user = null;

        try {
            btn.disabled = true;
            btn.innerText = "ĐANG XỬ LÝ...";

            // 1. Tạo tài khoản
            const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
            user = userCredential.user;

            // 2. Lưu hồ sơ (Đã import setDoc)
            await setDoc(doc(db, "users", user.uid), {
                fullName: name,
                email: email,
                role: "member",
                isCounted: false, 
                createdAt: new Date()
            });

            // 3. Gửi Email và thoát
            await sendEmailVerification(user);
            await signOut(auth);
			
			// Hiển thị khung thông báo màu vàng
			document.getElementById('verify-note').style.display = 'block';
			
			
			
			// Tùy chọn: Để người dùng ở lại trang 5 giây để đọc hướng dẫn rồi mới chuyển trang
			setTimeout(() => {
				window.location.href = "login.html";
			}, 5000);

            // Thay thế dòng alert cũ:
			alert("🎉 Đăng ký thành công!\n\nMột email xác minh đã được gửi đến: " + email + 
				  "\n\nLƯU Ý: Nếu không thấy trong Hộp thư đến, vui lòng kiểm tra kỹ hòm thư RÁC (SPAM) hoặc QUẢNG CÁO.");
			window.location.href = "login.html";

        } catch (error) {
            console.error("Lỗi:", error);
            if (user) {
                // Xóa user thừa nếu lỗi lưu database
                await deleteUser(user).catch(err => console.log("Đã dọn dẹp user."));
            }
            alert("Lỗi: " + error.message);
            btn.disabled = false;
            btn.innerText = "BẮT ĐẦU GIA NHẬP";
        }
    });
</script>
</body>
</html>
